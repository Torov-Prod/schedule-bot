# fly.toml app configuration file generated for schedule-bot-uvkvxw on 2026-10-28T10:00:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'schedule-bot-uvkvxw'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
